<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <meta name="description" content="Orbit a growing rose, step closer, and hold a moment in bloom. An interactive study by Huangxiangru's Lab Westlake University.">
  <meta property="og:title" content="Rose in motion · The Garden Hours">
  <meta property="og:image" content="https://raconiy.github.io/westlake-plant-growth-studio/media/cameras/rose/poster.jpg">
  <title>Rose in motion · Huangxiangru's Lab Westlake University</title>
  <link rel="preload" as="font" href="./fonts/instrument-serif.woff2" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./rose-camera.css?v=garden-2">
</head>
<body>
<header class="mast"><a class="collection" href="./">Flora<span>.</span></a><span class="lab">Huangxiangru's Lab <span>Westlake University</span></span><a href="./garden-hours.html">Watch the film</a></header>
<main>
  <div class="heading"><div class="specimen"><h1 id="plant-title">Rose in motion</h1><i lang="la" id="latin">Rosa</i></div>
    <nav id="plants" aria-label="Choose a live camera"><a href="?plant=rose">Rose</a></nav></div>
  <section class="instrument" id="instrument" aria-label="Interactive botanical camera">
    <div class="stage" id="stage">
      <img id="poster" width="1024" height="480" fetchpriority="high" alt="A deep crimson rose against the garden wall.">
      <canvas id="navigation" width="1024" height="480" aria-hidden="true"></canvas>
      <canvas id="rose" width="1024" height="480" tabindex="0" aria-label="Flower camera. Left and right orbit, up and down change distance, Space pauses or resumes growth." aria-describedby="guide" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Space"></canvas>
      <div class="status" id="status" role="status">Opening the camera…</div>
      <button id="retry" class="recover" hidden>Reload camera</button>
      <button id="expand" class="expand" aria-label="Enter fullscreen" title="Enter fullscreen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    </div>
    <div class="controls">
      <div class="camera-controls"><div class="pad" role="group" aria-label="Camera direction">
        <button data-key="up" class="up" aria-label="Move closer" title="Move closer">↑</button>
        <button data-key="left" class="left" aria-label="Orbit left" title="Orbit left">←</button>
        <button data-key="down" class="down" aria-label="Pull back" title="Pull back">↓</button>
        <button data-key="right" class="right" aria-label="Orbit right" title="Orbit right">→</button>
      </div><div><span id="action">Camera still</span><output id="pose">−103° · 1.00×</output></div></div>
      <div class="growth"><div class="growth-line"><label for="bloom">Bloom</label><output for="bloom" id="percent"></output></div>
        <input type="range" id="bloom" min="0" max="1000" step="1" value="186" aria-label="Bloom stage"></div>
      <div class="transport"><button id="play" type="button" disabled>Play growth</button><button id="reset" type="button">Reset view</button></div>
    </div>
  </section>
  <p id="guide">Drag to orbit. Use ↑ and ↓ to move closer or back. Press Space to hold the bloom.</p>
  <noscript>Enable JavaScript for the camera, or <a href="./garden-hours.html">watch the film</a>.</noscript>
</main>
<script type="module" src="./rose-camera.js?v=garden-2"></script>
</body></html>
