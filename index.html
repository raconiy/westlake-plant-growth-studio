<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Huangxiangru's Lab Westlake University</title><link rel="stylesheet" href="./studio.css"></head>
<body><header class="bar"><div class="top wrap"><a class="brand" href="./" aria-label="Flora 首页"><span class="mark" aria-hidden="true">✳</span>Flora<span class="dot">.</span></a><span class="appName">Huangxiangru's Lab Westlake University</span><a class="logButton" href="https://github.com/raconiy/westlake-plant-growth-studio/tree/demo/native-720p">GitHub ↗</a></div></header>
<main class="wrap"><section class="workspace" aria-label="生长工作台">
<aside class="catalog"><div class="caption"><h2>物种</h2></div><nav id="species" aria-label="切换物种"></nav>
<div class="plate" id="plate"><div class="plateMark">花部近景 · 生成</div><img id="portrait" alt=""><div class="plateType"><h1 id="filmTitle">玫瑰</h1><i id="botanical" lang="la">Rosa</i></div></div></aside>
<section class="instrument">
<div class="screenBar"><div class="switches" role="group" aria-label="画面模式"><button data-view="film" aria-pressed="true">生成成片</button><button data-view="mesh">4D 资产</button><button data-view="proxy">控制图</button></div><div class="screenTools"><output id="pixelSize"></output><button id="fullscreen" title="全屏画面" aria-label="全屏画面">⛶</button></div></div>
<div id="theatre" class="theatre"><video id="film" muted playsinline loop preload="auto" aria-label="生长影片"></video><video id="proxy" muted playsinline loop preload="auto" hidden></video><div id="meshPanel" hidden><canvas id="meshCanvas" width="832" height="480" aria-label="拖动旋转 4D 资产" tabindex="0"></canvas><div class="meshHUD"><span id="meshReadout"></span><span>拖动旋转</span></div></div><input type="range" id="meshTime" min="0" hidden><input type="range" id="meshAngle" min="-180" max="180" hidden><p id="emptyFilm" hidden></p>
<button id="focusShot" aria-pressed="true" hidden>跟看幼芽</button></div>
<div class="transport"><button id="toggle" class="play" aria-label="播放">▶</button><output id="timecode">00:00.0</output><span class="slash">/</span><span id="duration">00:08.1</span><span class="scrubHint">拖动胶片看生长</span><div id="sequence" aria-label="跳到生长阶段"></div></div>
<div class="stripBox" id="stripBox"><div id="stripArt"></div><div id="playhead"></div><div id="hoverFrame" aria-hidden="true" hidden><i></i><span></span></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="拖动生长时间线"></div>
<div class="bloom" id="singleTiming" hidden><label for="onset"><span aria-hidden="true">✳</span> 开花时刻</label><div class="onsetRail"><input id="onset" type="range" min="25" max="92" value="78" aria-label="拖动调整开花时刻"></div><output for="onset" id="onsetValue"></output><button id="undoTiming" title="恢复原花期" aria-label="恢复原花期" disabled>↶</button></div>

</section></section>
<footer class="viewerFooter"><p>拖动胶片查看生长过程。调整开花时刻可以即时预览不同花期，切换至「4D 资产」可拖动旋转。</p><a id="download" download>下载高清成片 ↓</a></footer><output id="status" role="status"></output></main>
<script src="./geometry.js"></script><script src="./viewer.js"></script></body></html>
